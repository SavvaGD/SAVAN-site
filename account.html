<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVAN — Личный кабинет</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Стили для бейджей грамот */
  .badge-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 8px;
    width: 70px;
    text-align: center;
  }
  
  .badge-img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    transition: transform 0.2s;
  }
  
  .badge-img:hover {
    transform: scale(1.1);
  }

  .badge-fallback {
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  
  .badge-title {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.2;
    word-wrap: break-word;
    width: 100%;
  }

  /* Стили для журнала наказаний */
  .log-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(239, 68, 68, 0.1);
    border-left: 3px solid #ef4444;
    padding: 8px 12px;
    margin-bottom: 8px;
    border-radius: 4px;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <nav class="container">
    <a href="index.html"><img src="logo.png" alt="SAVAN" class="logo-img"></a>
    <ul class="nav-links">
      <li><a href="index.html">Главная</a></li>
      <li><a href="lessons.html">Уроки</a></li>
      <li><a href="group.html">Группы</a></li>
      <li><a href="account.html" class="active btn btn-outline">Личный кабинет</a></li>
    </ul>
  </nav>
</header>

<section class="container" style="padding-top: 150px; min-height: 70vh;">
  <div class="modal-content" style="margin: 0 auto; display: block; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 40px; max-width: 550px;">
    <h2 style="text-align: center; margin-bottom: 20px; color: white;">Вход для учеников</h2>
    
    <!-- Форма входа -->
    <div id="login-form">
      <input type="email" id="email" placeholder="Email" style="width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--dark); color: white;">
      <input type="password" id="password" placeholder="Пароль" style="width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--dark); color: white;">
      <button onclick="doLogin()" class="btn btn-primary" style="width: 100%; margin-bottom: 10px;">Войти</button>
      <p style="color: var(--text-muted); font-size: 12px; text-align: center;">Тест: test@savan.ru / 123456</p>
    </div>

    <!-- Личный кабинет (скрыт при входе) -->
    <div id="dashboard" style="display: none;">
      <h3 id="user-email" style="color: var(--primary); margin-bottom: 20px; text-align: center; font-size: 18px;"></h3>
      
      <!-- Блок группы -->
      <div style="background: var(--dark); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border);">
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;">Имя: <span id="user-name" style="color: white; font-weight: bold;"></span></p>
        <h4 style="color: white; margin-top: 10px; margin-bottom: 5px;">Группа: <span id="user-group" style="color: var(--accent);"></span></h4>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">Расписание: <span id="user-schedule" style="color: white;"></span></p>
        <a id="telemost-link" href="#" target="_blank" class="btn btn-primary" style="width: 100%; text-align: center; display: block;">Подключиться к уроку</a>
      </div>

      <!-- Блок геймификации -->
      <div style="background: rgba(139,92,246,0.1); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--primary); text-align: left;">
        
        <!-- Очки -->
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
          <div>
            <p style="color: var(--text-muted); font-size: 12px; margin: 0;">Очки уважения</p>
            <h3 style="color: #10b981; font-size: 24px; margin: 0;" id="user-respect">0 🏆</h3>
          </div>
          <div style="text-align: right;">
            <p style="color: var(--text-muted); font-size: 12px; margin: 0;">Очки неуважения</p>
            <h3 style="color: #ef4444; font-size: 24px; margin: 0;" id="user-disrespect">0 💀</h3>
          </div>
        </div>

        <!-- Грамоты -->
        <div>
          <p style="color: var(--text-muted); font-size: 12px; margin-bottom: 5px;">Мои награды:</p>
          <div id="user-achievements" style="display: flex; gap: 5px; flex-wrap: wrap;">
            <span style="color: var(--text-muted); font-size: 14px;">Пока нет грамот</span>
          </div>
        </div>

        <!-- Журнал нарушений -->
        <div id="disrespect-log-container" style="display: none; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
          <p style="color: var(--text-muted); font-size: 12px; margin-bottom: 5px;">Журнал нарушений:</p>
          <div id="user-disrespect-log"></div>
        </div>
      </div>
      
      <button onclick="doLogout()" style="width: 100%; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold;">Выйти</button>
    </div>
  </div>
</section>

<footer><p>© 2026 SAVAN.</p></footer>

<script type="module">
  import { auth, login, logout, getUserAndGroupData, onAuthStateChanged } from './firebase.js';

  window.doLogin = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      await login(email, password);
    } catch (error) {
      alert('Ошибка входа: ' + error.message);
    }
  };

  window.doLogout = () => logout();

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('user-email').innerText = user.email;

      const data = await getUserAndGroupData(user.email);
      
      if (data && data.user) {
        document.getElementById('user-name').innerText = data.user.name || 'Ученик';
        
        // Заполняем группу
        if (data.group) {
          document.getElementById('user-group').innerText = data.group.name;
          document.getElementById('user-schedule').innerText = data.group.schedule;
          document.getElementById('telemost-link').href = data.group.telemost;
        }

        // Заполняем очки
        document.getElementById('user-respect').innerText = (data.user.respect_points || 0) + ' 🏆';
        document.getElementById('user-disrespect').innerText = (data.user.disrespect_points || 0) + ' 💀';
        
        // ВЫВОД ГРАМОТ (картинки)
        const achContainer = document.getElementById('user-achievements');
        achContainer.innerHTML = '';
        
        if (data.user.achievements && data.user.achievements.length > 0) {
          data.user.achievements.forEach(fileName => {
            const badgeWrapper = document.createElement('div');
            badgeWrapper.className = 'badge-container';

            const img = document.createElement('img');
            img.src = `achievements/${fileName}.png`; 
            img.className = 'badge-img';
            img.alt = fileName;
            
            // Если картинки нет - показываем заглушку
            img.onerror = () => {
              img.style.display = 'none';
              const fallback = document.createElement('div');
              fallback.className = 'badge-fallback';
              fallback.innerText = '📜';
              badgeWrapper.insertBefore(fallback, img.nextSibling);
            };

            // Подпись под картинкой (форматируем имя файла)
            const title = document.createElement('div');
            // Убираем подчеркивания и делаем первую букву заглавной
            let formattedTitle = fileName.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            title.innerText = formattedTitle;
            title.className = 'badge-title';

            badgeWrapper.appendChild(img);
            badgeWrapper.appendChild(title);
            achContainer.appendChild(badgeWrapper);
          });
        } else {
          achContainer.innerHTML = '<span style="color: var(--text-muted); font-size: 14px;">Пока нет грамот</span>';
        }

        // ВЫВОД ЖУРНАЛА НАРУШЕНИЙ
        const logContainer = document.getElementById('disrespect-log-container');
        const logList = document.getElementById('user-disrespect-log');
        
        if (data.user.disrespect_log && data.user.disrespect_log.length > 0) {
          logContainer.style.display = 'block';
          logList.innerHTML = '';
          data.user.disrespect_log.forEach(item => {
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `
              <span style="color: white;">${item.reason}</span>
              <span style="color: #ef4444; font-weight: bold;">-${item.points} 💀</span>
            `;
            logList.appendChild(div);
          });
        } else {
          logContainer.style.display = 'none';
        }

      }
    } else {
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    }
  });
</script>
</body>
</html>
