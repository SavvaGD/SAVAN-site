<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVAN — Личный кабинет</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="container">
    <a href="index.html"><img src="logo.png" alt="SAVAN" class="logo-img"></a>
    <ul class="nav-links">
      <li><a href="index.html">Главная</a></li>
      <li><a href="lessons.html">Уроки</a></li>
      <li><a href="group.html">Группы</a></li>
      <li><a href="account.html" class="active btn btn-outline">Личный кабинет</a></li>
    </ul>
  </nav>
</header>

<section class="container" style="padding-top: 150px; min-height: 70vh;">
  <div class="modal-content" style="margin: 0 auto; display: block; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 40px; max-width: 450px;">
    <h2 style="text-align: center; margin-bottom: 20px; color: white;">Вход для учеников</h2>
    
    <!-- Форма входа -->
    <div id="login-form">
      <input type="email" id="email" placeholder="Email" style="width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--dark); color: white;">
      <input type="password" id="password" placeholder="Пароль" style="width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--dark); color: white;">
      <button onclick="doLogin()" class="btn btn-primary" style="width: 100%; margin-bottom: 10px;">Войти</button>
      <p style="color: var(--text-muted); font-size: 12px; text-align: center;">Тест: test@savan.ru / 123456</p>
    </div>

    <!-- Данные ученика -->
    <div id="dashboard" style="display: none;">
      <h3 id="user-email" style="color: var(--primary); margin-bottom: 20px; text-align: center;"></h3>
      
      <div style="background: var(--dark); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border);">
        <p style="color: var(--text-muted); font-size: 14px;">Имя: <span id="user-name" style="color: white; font-weight: bold;"></span></p>
        <h4 style="color: white; margin-top: 10px; margin-bottom: 5px;">Группа: <span id="user-group" style="color: var(--accent);"></span></h4>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">Расписание: <span id="user-schedule" style="color: white;"></span></p>
        <a id="telemost-link" href="#" target="_blank" class="btn btn-primary" style="width: 100%; text-align: center; display: block;">Подключиться к уроку</a>
      </div>
      
      <button onclick="doLogout()" style="width: 100%; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold;">Выйти</button>
    </div>
  </div>
</section>

<footer><p>© 2026 SAVAN.</p></footer>

<!-- ПОДКЛЮЧАЕМ FIREBASE НАПРЯМУЮ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCO59_IWEHXOFMDOIhXYMeqzcZKw5rEq_0",
    authDomain: "savan-school.firebaseapp.com",
    projectId: "savan-school",
    storageBucket: "savan-school.firebasestorage.app",
    messagingSenderId: "16789921040",
    appId: "1:16789921040:web:ec08c90c1ad287aa8b1995"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.doLogin = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      alert('Ошибка входа: ' + error.message);
    }
  };

  window.doLogout = () => signOut(auth);

  // ГЛАВНОЕ ИСПРАВЛЕНИЕ: Ждем загрузки страницы!
  document.addEventListener('DOMContentLoaded', () => {
    
    onAuthStateChanged(auth, async (user) => {
      // Проверяем, существуют ли элементы на странице
      const loginForm = document.getElementById('login-form');
      const dashboard = document.getElementById('dashboard');

      if (!loginForm || !dashboard) return; 

      if (user) {
        loginForm.style.display = 'none';
        dashboard.style.display = 'block';
        document.getElementById('user-email').innerText = user.email;

        try {
          // Получаем данные ученика
          const userDoc = await getDoc(doc(db, "users", user.email));
          
          if (userDoc.exists()) {
            const userData = userDoc.data();
            document.getElementById('user-name').innerText = userData.name || 'Ученик';
            
            // Если есть ID группы, ищем её в коллекции groups
            if (userData.group) {
              const groupDoc = await getDoc(doc(db, "groups", userData.group));
              if (groupDoc.exists()) {
                const groupData = groupDoc.data();
                document.getElementById('user-group').innerText = groupData.name;
                document.getElementById('user-schedule').innerText = groupData.schedule;
                document.getElementById('telemost-link').href = groupData.telemost;
              } else {
                document.getElementById('user-group').innerText = 'Группа не найдена';
                document.getElementById('user-schedule').innerText = '—';
                document.getElementById('telemost-link').style.display = 'none';
              }
            }
          }
        } catch (e) {
          console.error("Ошибка загрузки базы:", e);
        }
      } else {
        loginForm.style.display = 'block';
        dashboard.style.display = 'none';
      }
    });

  });
</script>
</body>
</html>
