<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVAN — Магазин призов</title>
<link rel="stylesheet" href="/style.css">
<style>
  .store-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
    margin-top: 40px;
  }
  .store-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 30px;
    text-align: center;
    transition: all 0.3s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .store-card:hover {
    transform: translateY(-5px);
    border-color: var(--primary);
    box-shadow: 0 10px 30px rgba(139,92,246,0.2);
  }
  .store-img {
    width: 80px;
    height: 80px;
    object-fit: contain;
    margin-bottom: 15px;
  }
  .store-price {
    display: inline-block;
    background: rgba(16, 185, 129, 0.15);
    color: #10b981;
    padding: 6px 16px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 18px;
    margin-top: 15px;
    margin-bottom: 20px;
  }
  /* Стиль для описания товара */
  .store-desc {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 10px;
    margin-bottom: 15px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header id="site-header"></header>

<section class="container" style="padding-top: 150px; min-height: 70vh; padding-bottom: 100px;">
  <h2 class="section-title">Магазин призов</h2>
  <p class="section-subtitle">Трать очки уважения на крутые бонусы от SAVAN</p>

  <div class="store-grid" id="store-container">
    <p style="color: var(--text-muted); text-align: center; width: 100%;">Загрузка товаров...</p>
  </div>
</section>

<footer id="site-footer"></footer>
<script src="/incfah.js"></script>

<!-- Скрипт для загрузки товаров -->
<script type="module">
  import { db, auth } from '/firebase.js';
  import { doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const container = document.getElementById('store-container');

  async function loadStore() {
    try {
      const productsDoc = await getDoc(doc(db, "store", "products"));
      
      if (!productsDoc.exists()) {
        container.innerHTML = '<p style="color: var(--text-muted);">Магазин пока пуст.</p>';
        return;
      }

      const productsData = productsDoc.data();
      container.innerHTML = ''; 

      for (const [key, item] of Object.entries(productsData)) {
        const iconName = item.icon || 'default'; 
        const imgPath = `/prods/${iconName}.png`;
        const descriptionHTML = item.description 
          ? `<p class="store-desc">${item.description}</p>` 
          : `<p class="store-desc" style="opacity: 0.5;">Описание скоро появится...</p>`;

        const card = document.createElement('div');
        card.className = 'store-card';
        
        card.innerHTML = `
          <div>
            <img src="${imgPath}" class="store-img" alt="${item.name}" onerror="this.src='/logo.png'; this.style.opacity='0.5';">
            <h3>${item.name}</h3>
            ${descriptionHTML}
          </div>
          <div>
            <div class="store-price">${item.price} 🏆</div>
            <button onclick="buyProduct('${key}', ${item.price}, '${item.name}')" class="btn btn-primary" style="width: 100%;">Купить</button>
          </div>
        `;
        container.appendChild(card);
      }

    } catch (error) {
      console.error(error);
      container.innerHTML = '<p style="color: red;">Ошибка при загрузке магазина.</p>';
    }
  }

  // ФУНКЦИЯ ПОКУПКИ
  window.buyProduct = async (productId, price, productName) => {
    const user = auth.currentUser;
    
    if (!user) {
      alert('Для покупки нужно войти в личный кабинет!');
      window.location.href = '/account.html';
      return;
    }

    try {
      // 1. Получаем данные ученика
      const userRef = doc(db, "users", user.email);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        alert('Ошибка: профиль ученика не найден.');
        return;
      }

      const currentRespect = userSnap.data().respect_points || 0;

      // 2. Проверяем хватает ли очков
      if (currentRespect < price) {
        alert(`Недостаточно очков уважения! Нужно ${price}, у тебя ${currentRespect}.`);
        return;
      }

      // 3. Списываем очки
      const newRespect = currentRespect - price;
      await updateDoc(userRef, { respect_points: newRespect });

      // 4. Записываем покупку в store/buys
      const buysRef = doc(db, "store", "buys");
      const buyData = {
        buyer: user.email,
        product: productId,
        date: new Date().toISOString()
      };
      
      // Используем arrayUnion, чтобы добавить запись в массив history
      await updateDoc(buysRef, {
        history: arrayUnion(buyData)
      });

      // 5. Уведомляем тебя в Telegram (через бота)
      // ВАЖНО: Здесь мы не используем токен, а шлем запрос на Vercel, чтобы не светить его.
      try {
        await fetch('https://savan-bot.vercel.app/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            name: "Покупка в магазине", 
            phone: `Ученик ${user.email} купил "${productName}" (${price} очков)` 
          })
        });
      } catch(e) { console.log('Ошибка отправки уведомления'); }

      // 6. Показываем успех
      alert(`Успешно куплено: ${productName}! Списано ${price} очков. Остаток: ${newRespect}`);
      // Обновляем страницу для обновления карточек
      window.location.reload();

    } catch (error) {
      console.error(error);
      alert('Ошибка при покупке: ' + error.message);
    }
  };

  loadStore();
</script>
</body>
</html>
